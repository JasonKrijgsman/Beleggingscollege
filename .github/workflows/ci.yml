# CI voor Beleggingscollege: elke pull request en elke push naar main draait
# dezelfde controles als `npm run controle` lokaal. Omdat elke push naar main
# automatisch naar productie deployt (Vercel), is dit het hek vóór het
# betaalpad.
#
# Bewust ZONDER productiegeheimen en zonder databaseverbinding:
# - `next build` werkt zonder DATABASE_URL (src/db/index.ts gebruikt dan een
#   placeholder die nergens verbinding mee maakt);
# - de tests draaien tegen PGlite, een in-memory Postgres;
# - Mollie en Auth.js worden in tests gemockt.
# Heeft een stap hier ooit "toch even een echte key" nodig, dan is dat een
# ontwerpfout — zie docs/ci.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  controle:
    # Kort gehouden: dít is de naam die je in GitHub bij branch protection
    # als vereiste status check selecteert (GitHub toont jobnamen).
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Node 22 met npm-cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Schone installatie (npm ci)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Productiebuild
        run: npm run build

      - name: Bundelcontrole (geen quizantwoorden in publieke chunks)
        run: npm run controleer:bundel

  # Wordt main tóch een keer rood — twee groene PR's die samen kapot zijn
  # kunnen bij strict-mode alleen nog via een race — dan mag dat nooit stil
  # blijven: Vercel heeft op dat moment al gedeployd. Dit opent er een issue
  # over, zodat het pas weggaat als iemand er echt naar gekeken heeft.
  alarm:
    name: Alarm bij rode main
    runs-on: ubuntu-latest
    needs: controle
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      issues: write
    steps:
      - name: Open een issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "CI is rood op main (${GITHUB_SHA:0:7})" \
            --body "De CI-run op main is mislukt ná de merge — en Vercel heeft deze commit al naar productie gedeployd.

          Commit: ${GITHUB_SHA}
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Kijk eerst of productie echt kapot is (de build kan op main falen terwijl de site het nog doet), herstel dan via een nieuwe PR. Sluit dit issue pas als main weer groen is."
